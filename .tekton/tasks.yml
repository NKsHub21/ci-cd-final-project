apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the shared workspace before the pipeline runs
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      command:
        - /bin/sh
      args:
        - -c
        - |
          echo "Cleaning up workspace: ${WORKSPACE_SOURCE_PATH}"
          rm -rf ${WORKSPACE_SOURCE_PATH}/*

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  description: Lint with ESLint
  workspaces:
    - name: source
  steps:
    - name: eslint
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Lint with ESLint"
        npm install
        npm run lint

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest
spec:
  description: Run unit tests with Jest
  workspaces:
    - name: source
  steps:
    - name: jest
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Run unit tests with Jest"
        npm install
        npm test
