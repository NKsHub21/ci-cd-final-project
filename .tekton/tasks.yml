apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces: [{name: source}]
  steps:
    - name: remove
      image: alpine:3
      env: [{name: WORKSPACE_SOURCE_PATH, value: $(workspaces.source.path)}]
      script: rm -rf ${WORKSPACE_SOURCE_PATH}/*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest
spec:
  workspaces: [{name: source}]
  steps:
    - name: jest
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: npm install && echo "Run unit tests with Jest" && npm test
