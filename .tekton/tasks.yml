apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        rm -rf $(workspaces.source.path)/* $(workspaces.source.path)/.[!.]* || true

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: eslint
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
        npm run lint

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest
spec:
  workspaces:
    - name: source
  steps:
    - name: jest
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
        npm test
